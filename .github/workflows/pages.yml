name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara la cartella del sito
        run: |
          mkdir -p _site
          cp index.html style.css app.js esercizi_padel.json _site/
          touch _site/.nojekyll

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
